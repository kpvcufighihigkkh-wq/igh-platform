name: CI

# 触发策略：
#   - push 到 main：主干必须永远可发布
#   - 所有 PR：合并前拦截
#   - 手动：现场排查时也要能复跑
# 不跑 tag：发版由打包流程负责，避免与发布流水线重复构建。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新提交取消旧运行：CI 负载集中在固定几台 runner 上，
# 连续 push 时没必要把每一版都跑完。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：本流水线只读代码，不写仓库、不推镜像。
permissions:
  contents: read

env:
  # 关掉 CGO 之外的隐式行为：与 Makefile / 现场部署保持一致。
  # 注意 Go 侧 -race 需要 CGO，所以只在 race job 里单独打开。
  GOFLAGS: -trimpath

jobs:
  # ==========================================================================
  # 1) Go：静态检查 + 编译
  # ==========================================================================
  go-build:
    name: Go / vet + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 与 go.mod 的 `go 1.25.0` 对齐。
          # 这里刻意读 go.mod 而不是写死版本：保证本地能编的版本 CI 也能编。
          go-version-file: go.mod
          # go.sum 在 .gitignore 里（见下方说明），缓存键退化为 go.mod。
          # setup-go 在 go.sum 缺失时会自动只用 go.mod，不会报错。
          cache: true
          cache-dependency-path: go.mod

      # ----------------------------------------------------------------------
      # 关键坑：本仓库 .gitignore 里有一行 `go.sum`，go.sum 并未入库。
      # 干净检出后直接 `go build` 会失败：
      #   missing go.sum entry for module providing package ...
      # 而且 `go mod download` 也救不回来（它只下载不补全校验和）。
      # 这里用 `go mod tidy` 生成 go.sum，实测可让后续 build/test 正常通过。
      #
      # TODO(建议主人处理)：把 go.sum 从 .gitignore 删掉并入库。
      #   理由：go.sum 是完整性校验的基础，不入库意味着每次 CI 都在
      #   重新解析依赖版本，一旦上游打新 tag 就可能拉到不同的代码，
      #   构建不可复现；同时也失去了对依赖篡改的防护。
      #   在那之前，本步骤是必需的，且会掩盖 go.mod 与真实依赖的漂移。
      # ----------------------------------------------------------------------
      - name: 补齐 go.sum（未入库时的兜底）
        run: |
          if [ ! -f go.sum ]; then
            echo "::warning file=.gitignore::go.sum 未入库，正在用 go mod tidy 生成（构建不可复现，建议入库）"
            go mod tidy
          fi
          go mod verify

      # go vet 会报告真实缺陷（如 fmt 格式与参数类型不匹配）。
      # 注意：当前仓库有两处 IPv6 地址拼接告警，位于
      # internal/edge/printer/client.go、macsa.go，属于存量问题，
      # 修复方式见 docs/monitoring.md / 提交说明。在修复前本步骤会失败，
      # 这是刻意的——用 CI 把存量问题显式暴露出来，而不是关掉检查。
      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

  # ==========================================================================
  # 2) Go：单元测试
  # ==========================================================================
  # 测试全部使用 SQLite（见各 service 包的测试初始化），不需要 PostgreSQL
  # 服务容器。这里也**不注入** DB_PASSWORD 等真实口令：
  #   - configs-*/ 目录里有口令占位符（"${DB_PASSWORD}"），
  #     CI 不读真实配置，宁可让需要配置的测试自己失败也不引入假的安全感；
  #   - 需要数据库的测试用自己的临时 SQLite 文件。
  go-test:
    name: Go / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: 补齐 go.sum（未入库时的兜底）
        run: |
          if [ ! -f go.sum ]; then
            go mod tidy
          fi

      # 只跑 internal/...：cmd/ 下是 main 包（一次性组装代码），
      # 少有可测逻辑；integration 测试用 build tag 隔离，不受影响。
      - name: go test
        run: go test ./internal/... -count=1

  # ==========================================================================
  # 3) Go：竞态检测（分 job 并行，避免拖慢主测试）
  # ==========================================================================
  # 全量 -race 太慢，只挑并发最密集的核心包：
  #   archive   —— 归档删除与在线写入并发，且有 goroutine 生命周期
  #   server/ha —— 角色状态被多 goroutine 读（/health 与 keepalived 轮询）
  #   shared/ha —— etcd 租约续约的锁竞争
  #   eventbus  —— 事件分发与 ERP 入队
  #   edge/queue—— 边端本地队列的生产/消费
  go-race:
    name: Go / race（核心并发包）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: 补齐 go.sum（未入库时的兜底）
        run: |
          if [ ! -f go.sum ]; then
            go mod tidy
          fi

      # -race 依赖 CGO，而 GOFLAGS 里没有强制关闭；
      # ubuntu runner 自带 gcc，这里显式打开以免未来 GOFLAGS 变化导致静默跳过。
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race -count=1 \
            ./internal/server/archive/... \
            ./internal/server/ha/... \
            ./internal/server/eventbus/... \
            ./internal/shared/ha/... \
            ./internal/edge/queue/...

  # ==========================================================================
  # 4) 前端：类型检查 + 构建
  # ==========================================================================
  # script 名核对自 web/package.json：
  #   "dev": "vite"                        ← 无
  #   "build": "vue-tsc && vite build"     ← 已含类型检查
  #   "preview": "vite preview"            ← 无
  # 注意 package.json **没有** 独立的 typecheck/lint script，
  # 所以类型检查用 npx 直接调 vue-tsc；不要写成 `npm run typecheck`。
  web:
    name: Web / typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vite 5 要求 Node 18+；用 20 LTS 与现场开发机保持一致。
          node-version: "20"
          # package-lock.json 已入库，用 npm ci 保证可复现安装。
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      # tsconfig 里已配置 noEmit: true；这里显式再传一次，
      # 避免将来有人改了 tsconfig 导致 CI 意外生成文件。
      - name: vue-tsc 类型检查
        run: npx vue-tsc --noEmit

      - name: vite build
        run: npm run build

  # ==========================================================================
  # 5) 部署配置：Prometheus 语法校验
  # ==========================================================================
  # 规则文件写错（缩进、表达式里引用不存在的指标名拼错、label 拼错）
  # 在运行时表现为"规则静默不生效"——比报错更危险。
  # promtool 能在合并前把这类问题拦下来。
  # 用官方镜像，不额外下载二进制，版本与现场保持一致（现场也跑这套镜像）。
  prometheus-config:
    name: Deploy / promtool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 直接把文件挂到容器里期望的路径，
      # 这样 prometheus.yml 里的 rule_files 绝对路径也能被解析到。
      - name: promtool check config
        run: |
          docker run --rm \
            -v "$PWD/deployments/prometheus:/etc/prometheus" \
            -v "$PWD/deployments/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.53.0 check config /etc/prometheus/prometheus.yml

      # 单独再校验一次规则文件：check config 虽然会带上规则，
      # 但单独一步能让失败信息更直观（直接指向 alerts.yml）。
      - name: promtool check rules
        run: |
          docker run --rm \
            -v "$PWD/deployments/prometheus:/rules:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.53.0 check rules /rules/alerts.yml

      # 语义测试：check rules 只能验证表达式能解析，验证不了它会不会触发。
      # PromQL 写错时最常见的后果是"静默不触发"（例如漏了 or vector(0)，
      # 序列消失后 sum() 返回空向量，== 0 永远不匹配），语法检查完全看不出来。
      # 这个用例集实测抓到过 3 个这类缺陷，必须保留。
      - name: promtool test rules
        run: |
          docker run --rm \
            -v "$PWD/deployments/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.53.0 test rules /etc/prometheus/alerts.test.yml

      # file_sd 的目标文件是 JSON，写坏会导致整份配置启动失败。
      - name: 校验 file_sd 目标文件为合法 JSON
        if: hashFiles('deployments/prometheus/targets/*.json') != ''
        run: |
          for f in deployments/prometheus/targets/*.json; do
            echo "检查 $f"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

  # ==========================================================================
  # 6) 汇总门槛
  # ==========================================================================
  # 分支保护只需要勾这一个 job。否则新增的 job 不会自动纳入必过项，
  # 会出现"CI 有 5 个 job，但分支保护只盯 1 个"的漏洞。
  ci-success:
    name: CI 全部通过
    runs-on: ubuntu-latest
    needs: [go-build, go-test, go-race, web, prometheus-config]
    if: always()
    steps:
      - name: 检查各 job 结果
        env:
          RESULTS: >-
            ${{ needs.go-build.result }}
            ${{ needs.go-test.result }}
            ${{ needs.go-race.result }}
            ${{ needs.web.result }}
            ${{ needs.prometheus-config.result }}
        run: |
          echo "各 job 结果: $RESULTS"
          # cancelled 也判失败：被取消不等于通过。
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::存在未通过（$r）的 job"
              exit 1
            fi
          done
          echo "全部通过"
