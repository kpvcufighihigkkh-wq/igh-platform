# ============================================================================
# 业务 / 后台任务（重要缺口）
# 同上：不建空 group。补齐指标后再新建 igh-background-jobs 组。
# ============================================================================
#      # TODO(需补指标)：ERP 推送失败累积。
      # 现状：ERP 队列在数据库表 erp_sync_queues 里（status: pending/failed/sent，
      # 见 service/erp.go），有重试上限，但没有任何 Prometheus 指标。
      # "推送失败写不进库"这种情况代码里已有专门日志（erp.go 中
      # "标记失败状态也写入失败，该条会重复推送"），但没有计数器，
      # 无法告警——而这条恰好会导致 ERP 收到重复数据，是业务事故。
      #
      # 建议补（在 internal/server/service/erp.go 中加）：
      #   igh_erp_queue_pending              Gauge   待推送条数
      #   igh_erp_push_total{target,result}  Counter 推送结果
      #   igh_erp_queue_failed              Gauge   失败且超过重试上限的条数
      #
      # 规则形式：
      # - alert: IghERPPushFailureAccumulating
      #   expr: igh_erp_queue_failed > 50
