! Keepalived configuration for IGH Platform HA
! Deploy on both servers, change state/priority per node

vrrp_script chk_igh {
    script "/usr/bin/curl -sf http://127.0.0.1:8099/health"
    interval 3
    weight -20
    fall 3
    rise 2
}

vrrp_instance IGH_VIP {
    state MASTER          # MASTER on node1, BACKUP on node2
    interface eth0        # Service network interface
    virtual_router_id 51
    priority 100          # 100 on node1, 90 on node2
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass igh2026
    }

    virtual_ipaddress {
        192.168.10.100/24 dev eth0
    }

    track_script {
        chk_igh
    }

    notify_master "/etc/keepalived/notify.sh master"
    notify_backup "/etc/keepalived/notify.sh backup"
    notify_fault  "/etc/keepalived/notify.sh fault"
}
