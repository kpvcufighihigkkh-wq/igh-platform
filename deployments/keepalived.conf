! IGH Platform —— 中心双机热备 keepalived 配置
!
! 拓扑：两台服务器都常驻运行 igh-server，靠 VIP 漂移决定谁对外服务。
!       进程不启停，只挪流量 —— 切换最快，也不会出现"备机进程没起来"的空窗。
!
! 部署前必须修改（用 <尖括号> 标出的都是占位值）：
!   interface        网卡名（Linux: ip addr 查看；Windows 版 keepalived 不适用）
!   virtual_ipaddress 同一网段内未被占用的 VIP
!   priority         节点1 = 100，节点2 = 90；两台必须不同
!   state            节点1 = MASTER，节点2 = BACKUP
!   auth_pass        改成现场自己的口令（VrrpPassphrase，最多 8 字符）
!   health_port      与 configs/project.yaml 的 server.http_port 一致
!
! 健康检查用脚本而不是直接 curl：除了进程活着，还要确认这个节点连的是
! 可写的数据库。数据库被围栏（只读）的节点即使进程正常也不能接流量，
! 否则所有写入都会被拒绝。

vrrp_script chk_igh {
    script "/etc/keepalived/igh-check.sh"
    interval 3      # 每 3 秒检查一次
    weight -40      # 检查失败时优先级 -40，足以让 BACKUP(90) 超过 MASTER(100-40=60)
    fall 3          # 连续失败 3 次判定为故障（约 9 秒，留出数据库切换时间）
    rise 2          # 连续成功 2 次恢复（约 6 秒，避免刚切换就抢回）
    timeout 2
}

vrrp_instance IGH_VIP {
    state MASTER                 # <节点1: MASTER / 节点2: BACKUP>
    interface <eth0>             # <网卡名>
    virtual_router_id 51         # 同一网段内唯一
    priority 100                 # <节点1: 100 / 节点2: 90>
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass <igh2026>      # <改成现场口令，最多 8 字符>
    }

    virtual_ipaddress {
        <192.168.10.100>/24 dev <eth0>
    }

    track_script {
        chk_igh
    }

    # notify 脚本负责把本机角色写进状态文件，igh-server 每 2 秒读一次，
    # 在 /health 的 ha.role 里如实反映 master/backup。
    # 它不做服务启停 —— 两个进程始终都在跑。
    notify_master "/etc/keepalived/igh-notify.sh master"
    notify_backup "/etc/keepalived/igh-notify.sh backup"
    notify_fault  "/etc/keepalived/igh-notify.sh fault"
    notify_stop   "/etc/keepalived/igh-notify.sh stop"
}
