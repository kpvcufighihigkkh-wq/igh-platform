# IGH Edge 配置模板 — 卷绕站 (Winding Station)
# 复制此文件为 edge.yaml 并修改实际参数

edge:
  id: "edge-winding-01"        # 唯一节点标识，建议格式: edge-{type}-{序号}
  type: "winding"               # 站点类型: winding
  data_dir: "./data"            # SQLite 数据目录

  http:
    host: "0.0.0.0"
    port: 8080                  # 本地 Web 服务端口

  server:
    url: "http://192.168.1.100:8099"          # 中心服务器地址
    api_key: "sk-igh-change-in-production"    # API 认证密钥
    heartbeat_sec: 10                          # 心跳间隔
    sync_interval_sec: 30                      # 参考数据同步间隔

  plc:
    poll_interval_ms: 1000      # PLC 轮询周期 (ms)
    devices:
      # Barmag 卷绕机 PLC (S7 协议)
      - code: "plc-L01"
        model: "barmag_winder"
        host: "192.168.1.10"
        port: 102
        rack: 0
        slot: 1
        protocol: "s7"
        read_blocks:
          - { db: 1, start: 0, size: 100, tag: "status" }        # 设备状态
          - { db: 2, start: 0, size: 200, tag: "production" }    # 生产数据
          - { db: 3, start: 0, size: 50, tag: "speed" }          # 速度参数

      # 如有多台卷绕机，添加更多设备
      # - code: "plc-L02"
      #   model: "barmag_winder"
      #   host: "192.168.1.11"
      #   port: 102
      #   rack: 0
      #   slot: 1
      #   protocol: "s7"
      #   read_blocks:
      #     - { db: 1, start: 0, size: 100, tag: "status" }

  printers:
    # 丝饼标签打印机 (ZPL 兼容)
    - code: "label-winding-01"
      host: "192.168.1.50"
      port: 9100

  ha:
    mode: "standalone"          # standalone | active-standby
    peer: ""                    # 备机地址 (active-standby 模式)
    vip: ""                     # 虚拟 IP (active-standby 模式)
    priority: 100               # 优先级 (数字小=优先级高)

  line:
    code: "L01"                 # 产线编号
    name: "FDY Line 01"         # 产线名称
