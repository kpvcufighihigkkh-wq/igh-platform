services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: igh_platform
      POSTGRES_USER: igh
      POSTGRES_PASSWORD: ${DB_PASSWORD:-igh_dev_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  server:
    build:
      context: .
      dockerfile: deployments/Dockerfile.server
    ports:
      - "8099:8099"
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-igh_dev_2026}
      IGH_CONFIG_DIR: /app/configs
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      - postgres
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - server

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: igh2026
    depends_on:
      - prometheus

volumes:
  pgdata:
