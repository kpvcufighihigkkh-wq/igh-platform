services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: igh_platform
      POSTGRES_USER: igh
      POSTGRES_PASSWORD: ${DB_PASSWORD:-igh_dev_2026}
    ports:
      # 本机 5432 留给可能的其它 PostgreSQL；V5 开发库固定走 5434
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
