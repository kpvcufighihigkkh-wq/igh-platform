devices:
  - code: "sorting-laser-6h"
    model: "macsa_winder"
    host: "192.168.5.111"
    port: 102
    rack: 0
    slot: 1
    protocol: "s7"
    description: "外检打标机 6 头（Macsa，DB8012）"
    poll_groups:
      - name: "laser_start"
        db: 8012
        start: 0
        length: 12
        repeat:
          count: 6
          stride: 2
        points:
          - { name: "PLC_to_PC.LaserPrinter.Start", type: "int16", direction: "read" }
